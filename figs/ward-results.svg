  <text x="60" y="104" fill="#587087" font-family="Arial, Helvetica, sans-serif" font-size="19">Median F1 across models with scorable checkpoint outputs</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#24394e">
