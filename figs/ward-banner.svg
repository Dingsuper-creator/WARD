<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">WARD: evidence to state to action</title>
  <desc id="desc">A clinical agent benchmark linking observed evidence, patient state, and clinical action.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12253b"/>
      <stop offset="1" stop-color="#0b1729"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#63c7ca"/>
      <stop offset="1" stop-color="#7fa7f7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <circle cx="1105" cy="-40" r="180" fill="#233d5b" opacity=".34"/>
  <circle cx="1140" cy="260" r="190" fill="#294b67" opacity=".18"/>
  <path d="M48 246H1152" stroke="#45617d" stroke-width="1" opacity=".55"/>
  <rect x="48" y="48" width="52" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="48" y="126" fill="#f6f8fc" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="700" letter-spacing="1">WARD</text>
  <text x="49" y="164" fill="#b9c9dc" font-family="Arial, Helvetica, sans-serif" font-size="20">Seeing is not acting</text>
  <text x="49" y="204" fill="#8fa6c2" font-family="Arial, Helvetica, sans-serif" font-size="16">A benchmark for longitudinal clinical agents</text>
  <text x="49" y="270" fill="#7890aa" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="2">LONGITUDINAL  /  INTERACTIVE</text>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect x="546" y="92" width="174" height="84" rx="12" fill="#172f46" stroke="#59b9bb" stroke-width="2"/>
    <text x="633" y="142" fill="#d7f5f2" font-size="22" font-weight="600">Evidence</text>
    <path d="M729 134H761" stroke="#79afc2" stroke-width="3" stroke-linecap="round"/>
    <path d="m753 126 9 8-9 8" fill="none" stroke="#79afc2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="772" y="92" width="174" height="84" rx="12" fill="#1b3150" stroke="#7b9ae3" stroke-width="2"/>
    <text x="859" y="142" fill="#e1e8ff" font-size="22" font-weight="600">State</text>
    <path d="M955 134H987" stroke="#91a8d8" stroke-width="3" stroke-linecap="round"/>
    <path d="m979 126 9 8-9 8" fill="none" stroke="#91a8d8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="998" y="92" width="154" height="84" rx="12" fill="#263353" stroke="#a99ae2" stroke-width="2"/>
    <text x="1075" y="142" fill="#ece6ff" font-size="22" font-weight="600">Action</text>
    <text x="847" y="215" fill="#a9bcd1" font-size="16">Measure every transition, not just the final answer.</text>
  </g>
</svg>
